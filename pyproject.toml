[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinch-wgs"
version = "0.1.0.dev0"
description = "Information-theoretic gene-content and allele-type dependency discovery for bacterial WGS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "biopython>=1.83",
  "networkx>=3.2",
  "PyYAML>=6",
]

[project.optional-dependencies]
mapping = ["mappy>=2.31,<3"]
test = ["pytest>=8", "mappy>=2.31,<3"]

[project.scripts]
cinch = "cinch.cli:main"

[tool.setuptools.packages.find]
include = ["cinch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
